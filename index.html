<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trial Forest — Grassy Field</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; display: block; }

    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: rgba(20, 40, 20, 0.55); color: #fff; text-align: center;
      cursor: pointer; z-index: 10; backdrop-filter: blur(2px);
    }
    #overlay h1 { font-size: 2.2rem; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
    #overlay p { font-size: 1rem; opacity: .9; max-width: 460px; line-height: 1.5; }
    #overlay .key { display: inline-block; padding: 2px 8px; margin: 0 2px; border-radius: 5px;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); font-weight: 600; }
    #overlay .cta { margin-top: 10px; padding: 12px 26px; border-radius: 999px;
      background: #5cb85c; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

    /* Crosshair — a clean cross reticle with a centre dot. */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px;
      transform: translate(-50%, -50%); z-index: 4; pointer-events: none; display: none; }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255,255,255,.85);
      box-shadow: 0 0 2px rgba(0,0,0,.9);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    body.playing #crosshair { display: block; }

    #killcount { position: fixed; top: 14px; right: 16px; z-index: 5; display: none;
      color: #ff6a5a; font-weight: 800; font-size: 18px; letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; }
    #killcount #kills { color: #fff; }
    body.playing #killcount { display: block; }

    /* Torch battery: charge bar + spare count, top-left. */
    #battery { position: fixed; top: 14px; left: 14px; z-index: 5; display: none;
      align-items: center; gap: 7px; color: #cfe9ff; font-weight: 700; font-size: 14px;
      text-shadow: 0 2px 5px rgba(0,0,0,.8); pointer-events: none; }
    #batterybar { width: 90px; height: 12px; border-radius: 4px; overflow: hidden;
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); }
    #batteryfill { height: 100%; width: 100%;
      background: linear-gradient(90deg, #c8a015, #ffe66a); transition: width .2s linear; }
    #battery #batterycount { color: #fff; }
    body.playing #battery { display: flex; }

    #aniclip { position: fixed; bottom: 12px; left: 14px; z-index: 5; display: none;
      color: rgba(255,255,255,.5); font-size: 12px; letter-spacing: .5px;
      text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
    body.playing #aniclip { display: block; }

    /* Health bar, bottom-centre. */
    #healthbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 5; display: none; width: 260px; height: 16px; border-radius: 9px;
      background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.35);
      box-shadow: 0 2px 8px rgba(0,0,0,.6); overflow: hidden; pointer-events: none; }
    #healthfill { height: 100%; width: 100%;
      background: linear-gradient(90deg, #b81414, #36c43a);
      transition: width .25s ease; }
    body.playing #healthbar { display: block; }

    /* Sprint/stamina — minimal sliver, bottom-left. */
    #staminabar { position: fixed; bottom: 26px; left: 16px; z-index: 5; display: none;
      width: 150px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12);
      pointer-events: none; }
    #staminafill { height: 100%; width: 100%; border-radius: 2px;
      background: #8fe6c4; box-shadow: 0 0 6px rgba(143,230,196,.55); transition: width .08s linear; }
    body.playing #staminabar { display: block; }

    /* Ammo counter, bottom-right. */
    #ammo { position: fixed; bottom: 14px; right: 16px; z-index: 5; display: none;
      color: #ffd36a; font-weight: 800; font-size: 18px; letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; }
    #ammo #ammocount { color: #fff; }
    body.playing #ammo { display: block; }

    /* Red damage flash. */
    #hurt { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(140,0,0,.75) 100%); }
    #hurt.flash { animation: hurtflash .45s ease-out; }
    @keyframes hurtflash { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* Death screen. */
    #death { position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(20, 0, 0, .82); color: #fff; cursor: pointer; }
    #death h1 { font-size: 4rem; letter-spacing: 6px; color: #c81e1e;
      text-shadow: 0 4px 18px rgba(0,0,0,.7); }
    #death p { margin-top: 8px; opacity: .85; }
    #death .score { margin-top: 14px; font-size: 1.3rem; opacity: 1; font-weight: 700; }
    #death .score span { color: #ff6a5a; }
    #death .cta { margin-top: 22px; padding: 12px 26px; border-radius: 999px;
      background: #c81e1e; font-weight: 700; display: inline-block; }

    #loading {position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.2rem; z-index: 20; background: #05070d; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="crosshair" aria-hidden="true"></div>
  <div id="killcount">KILLS&nbsp; <span id="kills">0</span></div>
  <div id="battery">🔦 <div id="batterybar"><div id="batteryfill"></div></div> ×<span id="batterycount">0</span></div>
  <div id="healthbar"><div id="healthfill"></div></div>
  <div id="staminabar"><div id="staminafill"></div></div>
  <div id="ammo">AMMO&nbsp; <span id="ammocount">0</span></div>
  <div id="aniclip" title="press [ and ] to change the monster's walk animation">anim 8</div>
  <div id="hurt"></div>

  <div id="death">
    <div>
      <h1>YOU DIED</h1>
      <p>The forest took you.</p>
      <p class="score">You killed <span id="finalkills">0</span> of them.</p>
      <div class="cta">Click to try again</div>
    </div>
  </div>

  <div id="loading">Loading the forest floor…</div>

  <div id="overlay" style="display:none">
    <h1>🌲 Trial Forest</h1>
    <p>A dark forest at night. Something is out here with you in the black between
       the trees. Keep your torch lit — and keep moving.</p>
    <div class="cta">Click to enter</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./src/main.js?v=29"></script>
</body>
</html>
