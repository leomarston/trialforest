<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOODS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Architects+Daughter&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; display: block; }

    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: rgba(20, 40, 20, 0.55); color: #fff; text-align: center;
      cursor: pointer; z-index: 10; backdrop-filter: blur(2px);
    }
    #overlay h1 { font-size: 2.2rem; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
    #overlay p { font-size: 1rem; opacity: .9; max-width: 460px; line-height: 1.5; }
    #overlay .key { display: inline-block; padding: 2px 8px; margin: 0 2px; border-radius: 5px;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); font-weight: 600; }
    #overlay .cta { margin-top: 10px; padding: 12px 26px; border-radius: 999px;
      background: #5cb85c; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

    /* Crosshair — a clean cross reticle with a centre dot. */
    #crosshair { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px;
      transform: translate(-50%, -50%); z-index: 4; pointer-events: none; display: none; }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255,255,255,.85);
      box-shadow: 0 0 2px rgba(0,0,0,.9);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    body.playing #crosshair { display: block; }

    #killcount { position: fixed; top: 14px; right: 16px; z-index: 5; display: none;
      color: #ff6a5a; font-weight: 800; font-size: 18px; letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; }
    #killcount #kills { color: #fff; }
    body.playing #killcount { display: block; }

    /* Torch battery: charge bar + spare count, top-left. */
    #battery { position: fixed; top: 14px; left: 14px; z-index: 5; display: none;
      align-items: center; gap: 7px; color: #cfe9ff; font-weight: 700; font-size: 14px;
      text-shadow: 0 2px 5px rgba(0,0,0,.8); pointer-events: none; }
    #batterybar { width: 90px; height: 12px; border-radius: 4px; overflow: hidden;
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); }
    #batteryfill { height: 100%; width: 100%;
      background: linear-gradient(90deg, #c8a015, #ffe66a); transition: width .2s linear; }
    #battery #batterycount { color: #fff; }
    body.playing #battery { display: flex; }

    #aniclip { position: fixed; bottom: 12px; left: 14px; z-index: 5; display: none;
      color: rgba(255,255,255,.5); font-size: 12px; letter-spacing: .5px;
      text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
    body.playing #aniclip { display: block; }

    /* Health bar (red) — bottom-centre rectangle. */
    #healthbar { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 5; display: none; width: 260px; height: 16px;
      background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.35);
      box-shadow: 0 2px 8px rgba(0,0,0,.6); overflow: hidden; pointer-events: none; }
    #healthfill { height: 100%; width: 100%; background: #ff0000; transition: width .25s ease; }
    body.playing #healthbar { display: block; }

    /* Stamina bar (blue) — same rectangle, stacked just above the health bar. */
    #staminabar { position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%);
      z-index: 5; display: none; width: 260px; height: 16px;
      background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.35);
      box-shadow: 0 2px 8px rgba(0,0,0,.6); overflow: hidden; pointer-events: none; }
    #staminafill { height: 100%; width: 100%; background: #1e6bff; transition: width .08s linear; }
    body.playing #staminabar { display: block; }

    /* Ammo counter, bottom-right. */
    #ammo { position: fixed; bottom: 14px; right: 16px; z-index: 5; display: none;
      color: #ffd36a; font-weight: 800; font-size: 18px; letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; }
    #ammo #ammocount { color: #fff; }
    body.playing #ammo { display: block; }

    /* Red damage flash. */
    #hurt { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(140,0,0,.75) 100%); }
    #hurt.flash { animation: hurtflash .45s ease-out; }
    @keyframes hurtflash { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* Blood that creeps in from the corners as health drops. */
    #bloodvig { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
      transition: opacity .4s ease;
      background:
        radial-gradient(ellipse at center, transparent 42%, rgba(70,0,0,.92) 100%),
        radial-gradient(circle at 0% 100%,   rgba(110,0,0,.55), transparent 30%),
        radial-gradient(circle at 100% 0%,   rgba(110,0,0,.55), transparent 30%); }

    /* Diegetic warnings — pop up big in the centre, then fade out. */
    #warn { position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%); z-index: 6;
      text-align: center; color: #b33b2c; pointer-events: none; opacity: 0;
      font-family: 'Architects Daughter', system-ui, sans-serif;
      font-size: clamp(30px, 4.5vw, 56px); letter-spacing: .06em;
      text-shadow: 0 3px 12px rgba(0,0,0,.9); white-space: nowrap; }
    #warn.show { animation: warnpop 2.6s ease forwards; }
    @keyframes warnpop {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(.85); }
      12%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      72%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.06); }
    }

    /* Death screen. */
    #death { position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(20, 0, 0, .82); color: #fff; }
    #death > div { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #death h1 { font-size: 4rem; letter-spacing: 6px; color: #c81e1e;
      text-shadow: 0 4px 18px rgba(0,0,0,.7); margin-bottom: 14px; }
    #death .d-btn { font-family: 'Architects Daughter', system-ui, sans-serif;
      font-size: 28px; letter-spacing: .05em; color: #d9d9d7; cursor: pointer;
      background: rgba(42,44,48,.72); border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px; padding: .25em 1.4em; min-width: 230px; }
    #death .d-btn:hover { background: rgba(72,74,80,.85); color: #fff; }

    /* Loading screen — the full menu scene with a bar at the bottom. */
    #loading { position: fixed; inset: 0; display: none; z-index: 20; overflow: hidden;
      background: #05060a; font-family: 'Architects Daughter', system-ui, sans-serif; }
    #loadbar { position: absolute; left: 8%; right: 8%; bottom: 8%; height: 14px; z-index: 6;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 3px;
      overflow: hidden; }
    #loadfill { height: 100%; width: 0%; background: #9a1414; transition: width .25s ease; }

    /* ===================== MAIN MENU ("WOODS") ===================== */
    #menu { position: fixed; inset: 0; z-index: 40; overflow: hidden; background: #05060a;
      font-family: 'Architects Daughter', system-ui, sans-serif; }

    /* Dark room / wooden door backdrop. */
    .m-scene { position: absolute; inset: 0; z-index: 1;
      background:
        radial-gradient(ellipse 52% 66% at 53% 44%, rgba(78,60,40,.55), rgba(18,14,10,0) 72%),
        linear-gradient(#0b0a08, #050404); }
    .m-scene::before { content: ""; position: absolute; left: 30%; right: 16%; top: 6%; bottom: 16%;
      background:
        linear-gradient(90deg, transparent 49.4%, rgba(0,0,0,.45) 49.7%, transparent 50%),
        linear-gradient(90deg, transparent 24.6%, rgba(0,0,0,.4) 25%, transparent 25.4%),
        linear-gradient(90deg, transparent 74.6%, rgba(0,0,0,.4) 75%, transparent 75.4%),
        linear-gradient(180deg, rgba(60,46,30,.30), rgba(30,22,14,.10));
      filter: blur(.4px); }
    .m-scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
      background: linear-gradient(rgba(0,0,0,0), rgba(8,8,10,.92)); }

    /* Ceiling fluorescent tube with halo + flicker. */
    .m-light { position: absolute; top: clamp(34px, 9vh, 110px); left: 50%; transform: translateX(-50%);
      z-index: 3; width: clamp(280px, 40vw, 540px); height: clamp(16px, 2.4vh, 26px); border-radius: 13px;
      background: linear-gradient(#ffffff, #ffe6b8);
      box-shadow: 0 0 55px 20px rgba(255,226,170,.5), 0 0 150px 70px rgba(255,205,140,.22);
      animation: m-flicker 5s infinite steps(1); }
    .m-light::before { content: ""; position: absolute; left: -14%; right: -14%; top: -180%; height: 320%;
      background: radial-gradient(ellipse at center top, rgba(255,220,165,.28), transparent 70%);
      pointer-events: none; }
    @keyframes m-flicker {
      0%,89%,100% { opacity: 1; } 90% { opacity: .45; } 91% { opacity: .9; }
      92% { opacity: .25; } 93% { opacity: .85; } 94% { opacity: .55; } 95% { opacity: 1; }
    }

    /* Edge vignette. */
    .m-vig { position: absolute; inset: 0; z-index: 4; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 34%, rgba(0,0,0,.86) 100%); }

    /* Title block. */
    .m-title { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
      align-items: center; justify-content: center; pointer-events: none; text-align: center; }
    .m-title h1 { font-family: 'Rubik Wet Paint', Impact, fantasy; font-weight: 400;
      font-size: clamp(80px, 17vw, 230px); line-height: .9; letter-spacing: .03em;
      color: #e7e2d6; position: relative;
      text-shadow: 0 6px 34px rgba(0,0,0,.85), 0 0 4px rgba(0,0,0,.6); }
    .m-title h1::after { content: ""; position: absolute; left: -5%; right: -5%; top: 50%;
      height: clamp(4px, .55vw, 9px); background: #7d0c0c; transform: rotate(-8deg);
      box-shadow: 0 0 9px rgba(150,0,0,.6); opacity: .9; }
    .m-title p { margin-top: .55em; color: #7a1414; letter-spacing: .34em;
      font-size: clamp(12px, 1.6vw, 22px); opacity: .82; text-transform: uppercase; }

    /* Left button stack. */
    .m-buttons { position: absolute; left: clamp(22px, 7vw, 120px); top: 50%; transform: translateY(-50%);
      z-index: 6; display: flex; flex-direction: column; gap: clamp(14px, 2.2vw, 26px); }
    .m-buttons button { font-family: 'Architects Daughter', system-ui, sans-serif;
      font-size: clamp(24px, 2.8vw, 44px); color: #d9d9d7; background: rgba(42,44,48,.66);
      border: 1px solid rgba(255,255,255,.13); border-radius: 12px; padding: .18em .85em;
      min-width: clamp(150px, 16vw, 232px); text-align: left; letter-spacing: .05em; cursor: pointer;
      backdrop-filter: blur(2px); transition: background .15s, color .15s, transform .08s; }
    .m-buttons button:hover { background: rgba(72,74,80,.82); color: #fff; }
    .m-buttons button:active { transform: scale(.98); }

    /* Settings panel. */
    #settings { position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; background: rgba(4,5,9,.92);
      font-family: 'Architects Daughter', system-ui, sans-serif; }
    #settings .panel { width: min(440px, 88vw); padding: 30px 34px;
      background: rgba(20,21,25,.9); border: 1px solid rgba(255,255,255,.14); border-radius: 16px;
      box-shadow: 0 18px 60px rgba(0,0,0,.6); }
    #settings h2 { color: #e7e2d6; font-size: 38px; letter-spacing: .08em; margin-bottom: 18px; }
    #settings .row { margin: 20px 0; }
    #settings .row label { display: flex; justify-content: space-between; color: #cfd0d2;
      font-size: 21px; letter-spacing: .04em; margin-bottom: 8px; }
    #settings .row label span { color: #ff8a6a; }
    #settings input[type=range] { width: 100%; accent-color: #b81e1e; height: 4px; cursor: pointer; }
    #settings .row.toggle { display: flex; align-items: center; justify-content: space-between; }
    #settings .tgl { font-family: inherit; font-size: 20px; letter-spacing: .08em; cursor: pointer;
      color: #fff; background: #2f7a32; border: 1px solid rgba(255,255,255,.2); border-radius: 10px;
      padding: .15em .9em; min-width: 92px; }
    #settings .tgl.off { background: #5a2020; color: #d7b7b7; }
    #settings .back { margin-top: 26px; width: 100%; font-family: inherit; font-size: 26px;
      color: #d9d9d7; background: rgba(50,52,56,.8); border: 1px solid rgba(255,255,255,.13);
      border-radius: 12px; padding: .25em; cursor: pointer; letter-spacing: .06em; }
    #settings .back:hover { background: rgba(80,82,88,.9); color: #fff; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="crosshair" aria-hidden="true"></div>
  <div id="killcount">KILLS&nbsp; <span id="kills">0</span></div>
  <div id="battery">🔦 <div id="batterybar"><div id="batteryfill"></div></div> ×<span id="batterycount">0</span></div>
  <div id="healthbar"><div id="healthfill"></div></div>
  <div id="staminabar"><div id="staminafill"></div></div>
  <div id="ammo">AMMO&nbsp; <span id="ammocount">0</span></div>
  <div id="aniclip" title="press [ and ] to change the monster's walk animation">anim 8</div>
  <div id="bloodvig"></div>
  <div id="hurt"></div>
  <div id="warn"></div>

  <div id="death">
    <div>
      <h1>YOU DIED</h1>
      <button id="btn-again" class="d-btn">Play again</button>
      <button id="btn-menu" class="d-btn">Main Menu</button>
    </div>
  </div>

  <div id="loading">
    <div class="m-scene"></div>
    <div class="m-light"></div>
    <div class="m-vig"></div>
    <div class="m-title">
      <h1>WOODS</h1>
      <p>Some places aren't meant to be found</p>
    </div>
    <div id="loadbar"><div id="loadfill"></div></div>
  </div>

  <div id="overlay" style="display:none">
    <div class="cta">Click to enter the woods</div>
  </div>

  <!-- Main menu -->
  <div id="menu">
    <div class="m-scene"></div>
    <div class="m-light"></div>
    <div class="m-vig"></div>
    <div class="m-title">
      <h1>WOODS</h1>
      <p>Some places aren't meant to be found</p>
    </div>
    <nav class="m-buttons">
      <button id="btn-start">START</button>
      <button id="btn-settings">SETTINGS</button>
      <button id="btn-quit">QUIT</button>
    </nav>
  </div>

  <!-- Settings panel -->
  <div id="settings">
    <div class="panel">
      <h2>SETTINGS</h2>
      <div class="row">
        <label>Mouse sensitivity <span id="set-sens-val">1.00×</span></label>
        <input id="set-sens" type="range" min="0.2" max="3" step="0.05">
      </div>
      <div class="row toggle">
        <label>FX</label>
        <button id="set-fx" class="tgl">ON</button>
      </div>
      <div class="row toggle">
        <label>Music</label>
        <button id="set-music" class="tgl">ON</button>
      </div>
      <button class="back" id="btn-set-back">BACK</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./src/main.js?v=38"></script>
</body>
</html>
